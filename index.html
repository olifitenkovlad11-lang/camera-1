<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Камера QR</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
#app{position:fixed;inset:0;background:#000}#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
.top{position:absolute;z-index:4;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 12px) 24px 0;display:flex;justify-content:space-between;align-items:center}
.pill{background:rgba(38,38,40,.94);border-radius:30px}.heif{padding:12px 17px;font-size:16px;font-weight:600}
.controls{display:flex;align-items:center;gap:19px;padding:10px 16px;font-size:25px;line-height:1}.flash{font-size:27px}.more{font-size:25px;letter-spacing:2px}
.green{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 8px);width:9px;height:9px;transform:translateX(-50%);border-radius:50%;background:#20d96c}
.status{position:absolute;z-index:5;top:calc(env(safe-area-inset-top) + 78px);left:50%;transform:translateX(-50%);padding:7px 14px;border-radius:18px;background:rgba(0,0,0,.52);font-size:14px;opacity:0}.status.show{opacity:1}
.zoom{position:absolute;z-index:4;left:50%;bottom:calc(230px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:25px;align-items:center;font-size:17px}.zoom b{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(35,35,37,.95);color:#ffd900;font-size:16px}
.bottom{position:absolute;z-index:3;left:0;right:0;bottom:0;height:235px;padding:0 40px calc(env(safe-area-inset-bottom) + 22px);background:#000;display:flex;flex-direction:column;justify-content:flex-end}
.modes{align-self:center;display:flex;background:#242426;border-radius:28px;padding:3px;margin-bottom:40px}.mode{padding:10px 22px;border-radius:25px;font-size:17px}.active{background:#3a3a3c;color:#ffd900}
.row{display:flex;align-items:center;justify-content:space-between}.thumb{width:66px;height:66px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.45);background:#333}.thumb img{width:100%;height:100%;object-fit:cover}
.shutter{width:84px;height:84px;border-radius:50%;background:#fff;border:7px solid #343436;box-shadow:0 0 0 1px rgba(255,255,255,.4) inset}
.flip{width:58px;height:58px;border:0;border-radius:50%;background:#242426;color:#fff;font-size:30px}
#start{position:absolute;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);border:0;border-radius:28px;background:#fff;color:#000;padding:14px 22px;font-size:16px;font-weight:700}.hidden{display:none!important}
#canvas{display:none}
</style></head>
<body><div id="app">
<video id="video" autoplay muted playsinline></video><canvas id="canvas"></canvas>
<div class="top"><div class="pill heif">HEIF 24</div><div class="green"></div>
<div class="pill controls"><span>☾</span><span class="flash">ϟ</span><span>◎</span><span class="more">•••</span></div></div>
<div id="status" class="status">Сканирование…</div>
<div class="zoom"><span>0,5</span><b>1×</b><span>2</span></div>
<div class="bottom"><div class="modes"><div class="mode">ВИДЕО</div><div class="mode active">ФОТО</div></div>
<div class="row"><div class="thumb"><img id="thumb" alt=""></div><div class="shutter"></div><button id="flip" class="flip">↻</button></div></div>
<button id="start">Запустить камеру</button></div>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
const TARGET="https://olifitenkovlad11-lang.github.io/imessage-demo16/";
const video=document.getElementById("video"),canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d",{willReadFrequently:true});
const start=document.getElementById("start"),flip=document.getElementById("flip"),status=document.getElementById("status");
let stream=null,facing="environment",running=false,locked=false,timer=null;
function msg(t,on=true){status.textContent=t;status.classList.toggle("show",on)}
async function startCamera(){
 stopCamera();
 if(!navigator.mediaDevices?.getUserMedia){msg("Откройте приложение через HTTPS");return}
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},audio:false});
  video.srcObject=stream;await video.play();running=true;locked=false;start.classList.add("hidden");msg("Сканирование…");scan();
 }catch(e){msg("Разрешите доступ к камере в настройках iPhone")}
}
function stopCamera(){running=false;if(timer)clearTimeout(timer);timer=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function scan(){
 if(!running||locked)return;
 if(video.readyState>=2&&video.videoWidth){
  const scale=Math.min(1,900/video.videoWidth);canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  const img=ctx.getImageData(0,0,canvas.width,canvas.height);
  if(window.jsQR){const code=jsQR(img.data,img.width,img.height,{inversionAttempts:"dontInvert"});if(code?.data){openApp();return}}
 }
 timer=setTimeout(scan,120);
}
function openApp(){if(locked)return;locked=true;msg("QR-код найден");stopCamera();setTimeout(()=>location.href=TARGET,250)}
start.onclick=startCamera;flip.onclick=()=>{facing=facing==="environment"?"user":"environment";startCamera()};window.addEventListener("pagehide",stopCamera);
</script></body></html>

<!doctype html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Камера</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
#app{position:fixed;inset:0;background:#000}#view{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
.top{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 18px 0;z-index:5;display:flex;justify-content:space-between;align-items:center}
.heif{font-size:17px;font-weight:600;background:rgba(45,45,48,.92);padding:10px 15px;border-radius:24px}.dot{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 7px);transform:translateX(-50%);width:9px;height:9px;border-radius:50%;background:#22d66f}
.tools{display:flex;gap:7px;background:rgba(45,45,48,.92);padding:8px 10px;border-radius:25px}.tool{width:29px;height:29px;display:grid;place-items:center;font-size:19px}.more{font-size:22px}
.bottom{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:0 24px calc(env(safe-area-inset-bottom) + 18px);background:linear-gradient(transparent,rgba(0,0,0,.85) 35%,#000 65%);height:235px;display:flex;flex-direction:column;justify-content:flex-end}
.modes{align-self:center;margin-bottom:22px;display:flex;background:rgba(35,35,37,.96);border-radius:30px;padding:3px}.mode{padding:10px 17px;font-size:17px}.active{color:#ffe600;background:#3b3b3d;border-radius:26px}
.row{display:flex;align-items:center;justify-content:space-between}.thumb{width:64px;height:64px;border-radius:50%;background:#333;border:2px solid rgba(255,255,255,.35)}
.shutter{width:82px;height:82px;border-radius:50%;background:#fff;border:7px solid #3a3a3c;box-shadow:0 0 0 2px rgba(255,255,255,.35) inset}
.flip{width:55px;height:55px;border:0;border-radius:50%;background:rgba(45,45,48,.95);color:#fff;font-size:30px}.help{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 115px);transform:translateX(-50%);font-size:12px;color:#ddd;z-index:6;white-space:nowrap}
.status{position:absolute;top:calc(env(safe-area-inset-top) + 72px);left:50%;transform:translateX(-50%);z-index:7;white-space:nowrap;background:rgba(0,0,0,.55);padding:7px 13px;border-radius:18px;opacity:0}.show{opacity:1}
.scanbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:70vw;height:70vw;max-width:310px;max-height:310px;z-index:3;opacity:0}.scanbox.on{opacity:1}
.corner{position:absolute;width:42px;height:42px;border-color:#fff;border-style:solid}.c1{left:0;top:0;border-width:4px 0 0 4px;border-radius:20px 0 0}.c2{right:0;top:0;border-width:4px 4px 0 0;border-radius:0 20px 0}.c3{left:0;bottom:0;border-width:0 0 4px 4px;border-radius:0 0 0 20px}.c4{right:0;bottom:0;border-width:0 4px 4px 0;border-radius:0 0 20px}
#start{position:absolute;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);border:0;border-radius:28px;padding:14px 22px;background:#fff;color:#000;font-size:16px;font-weight:700}.hidden{display:none!important}
</style></head><body><div id="app">
<video id="view" playsinline muted></video>
<div class="top"><div class="heif">HEIF 24</div><div class="dot"></div><div class="tools"><div class="tool">☾</div><div class="tool">ϟ</div><div class="tool">◎</div><div class="tool more">•••</div></div></div>
<div id="status" class="status"></div><div id="scanbox" class="scanbox"><i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i></div>
<button id="start">Запустить камеру</button>
<div class="bottom"><div class="modes"><div class="mode">ВИДЕО</div><div class="mode active">ФОТО</div></div><div class="row"><div class="thumb"></div><div class="shutter"></div><button id="flip" class="flip">↻</button></div></div>
<div class="help">Наведи камеру на QR — он автоматически откроет приложение</div></div>
<script>
const TARGET="https://olifitenkovlad11-lang.github.io/imessage-demo16/";
const v=document.getElementById("view"),s=document.getElementById("start"),f=document.getElementById("flip"),st=document.getElementById("status"),box=document.getElementById("scanbox");
let stream=null,raf=0,facing="environment",locked=false,detector=null;
function msg(t,on=true){st.textContent=t;st.classList.toggle("show",on)}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
async function start(){
 stop();try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},audio:false})}
 catch(e){msg("Разрешите доступ к камере в настройках iPhone");return}
 v.srcObject=stream;await v.play();s.classList.add("hidden");box.classList.add("on");msg("Сканирование…");
 if("BarcodeDetector"in window){try{detector=new BarcodeDetector({formats:["qr_code"]})}catch(e){detector=null}} scan()}
async function scan(){if(!stream||locked)return;try{if(detector){let c=await detector.detect(v);if(c.length&&c[0].rawValue){openApp();return}}}catch(e){}raf=requestAnimationFrame(scan)}
function openApp(){if(locked)return;locked=true;msg("QR-код найден");stop();setTimeout(()=>location.href=TARGET,180)}
s.onclick=start;f.onclick=()=>{facing=facing==="environment"?"user":"environment";start()};addEventListener("pagehide",stop);
</script></body></html>
